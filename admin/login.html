<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Admin Login | TGS Survey & Geoinformatics</title>

<!-- Google Fonts + Icons -->
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, #f5f7fa 0%, #eef2f0 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  /* Login Container */
  .login-wrapper {
    width: 100%;
    max-width: 460px;
  }

  .brand-header {
    text-align: center;
    margin-bottom: 2rem;
  }

  .brand-logo {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 1.8rem;
    font-weight: 800;
    color: #ff6a00;
    text-decoration: none;
    margin-bottom: 0.5rem;
  }

  .brand-logo span {
    background: #ff6a00;
    width: 8px;
    height: 32px;
    border-radius: 4px;
    display: inline-block;
  }

  .brand-tagline {
    font-size: 0.85rem;
    color: #5f6c64;
  }

  .auth-card {
    background: white;
    border-radius: 32px;
    padding: 2.5rem;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
    border: 1px solid rgba(255, 106, 0, 0.1);
  }

  .auth-header {
    text-align: center;
    margin-bottom: 2rem;
  }

  .auth-header h2 {
    font-size: 1.8rem;
    font-weight: 700;
    color: #1e2a2e;
    margin-bottom: 0.5rem;
  }

  .auth-header p {
    color: #5f6c64;
    font-size: 0.9rem;
  }

  .lock-icon {
    background: #fff1e6;
    width: 56px;
    height: 56px;
    border-radius: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 1rem;
  }

  .lock-icon i {
    font-size: 1.8rem;
    color: #ff6a00;
  }

  /* Form Styles */
  .input-group {
    margin-bottom: 1.5rem;
  }

  .input-label {
    display: block;
    font-weight: 600;
    font-size: 0.85rem;
    margin-bottom: 0.5rem;
    color: #1e2a2e;
  }

  .input-field {
    width: 100%;
    padding: 0.9rem 1rem;
    border: 1.5px solid #e2e8f0;
    border-radius: 16px;
    font-family: 'Inter', sans-serif;
    font-size: 0.95rem;
    transition: all 0.2s ease;
    background: white;
  }

  .input-field:focus {
    outline: none;
    border-color: #ff6a00;
    box-shadow: 0 0 0 3px rgba(255, 106, 0, 0.1);
  }

  .input-field::placeholder {
    color: #b9c2bc;
  }

  /* Button */
  .login-btn {
    width: 100%;
    padding: 0.9rem;
    background: #ff6a00;
    color: white;
    border: none;
    border-radius: 40px;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.25s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    margin-top: 0.5rem;
  }

  .login-btn:hover {
    background: #e05f00;
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(255, 106, 0, 0.25);
  }

  .login-btn:active {
    transform: translateY(0);
  }

  /* Footer Links */
  .auth-footer {
    text-align: center;
    margin-top: 1.8rem;
    padding-top: 1.5rem;
    border-top: 1px solid #edf2ef;
  }

  .auth-footer p {
    color: #5f6c64;
    font-size: 0.85rem;
  }

  .auth-footer a {
    color: #ff6a00;
    text-decoration: none;
    font-weight: 600;
  }

  .auth-footer a:hover {
    text-decoration: underline;
  }

  /* Back to site link */
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: 1.5rem;
    text-align: center;
    justify-content: center;
    width: 100%;
    color: #5f6c64;
    text-decoration: none;
    font-size: 0.85rem;
    transition: 0.2s;
  }

  .back-link:hover {
    color: #ff6a00;
  }

  /* Alert/Messages */
  .alert-message {
    background: #fee2e2;
    color: #c2410c;
    padding: 0.75rem 1rem;
    border-radius: 12px;
    font-size: 0.8rem;
    margin-bottom: 1rem;
    display: none;
  }

  .alert-message.show {
    display: block;
  }

  /* Loading state */
  .login-btn.loading {
    opacity: 0.7;
    cursor: not-allowed;
  }

  /* Responsive */
  @media (max-width: 500px) {
    .auth-card {
      padding: 1.8rem;
    }
    .auth-header h2 {
      font-size: 1.5rem;
    }
  }
</style>
</head>
<body>

<div class="login-wrapper">
  <div class="brand-header">
    <div class="brand-logo">
      <span></span>
      TGS Geospatial
    </div>
    <div class="brand-tagline">Precision Survey & Geoinformatics</div>
  </div>

  <div class="auth-card">
    <div class="auth-header">
      <div class="lock-icon">
        <i class="fa-solid fa-lock"></i>
      </div>
      <h2>Admin Access</h2>
      <p>Sign in to manage your portfolio and projects</p>
    </div>

    <div id="errorAlert" class="alert-message">
      <i class="fa-solid fa-circle-exclamation"></i> <span id="errorText"></span>
    </div>

    <div class="input-group">
      <label class="input-label"><i class="fa-regular fa-envelope"></i> Email Address</label>
      <input type="email" id="loginEmail" class="input-field" placeholder="admin@tgsgeo.com" autocomplete="email">
    </div>

    <div class="input-group">
      <label class="input-label"><i class="fa-solid fa-key"></i> Password</label>
      <input type="password" id="loginPassword" class="input-field" placeholder="Enter your password" autocomplete="current-password">
    </div>

    <button id="loginButton" class="login-btn">
      <i class="fa-solid fa-arrow-right-to-bracket"></i> Login to Dashboard
    </button>

    <div class="auth-footer">
      <p>Secure admin area — authorized access only</p>
      <!-- <p><a href="signup.html">Create an account</a> |  -->
    <a href="../index.html">Back to website</a></p>
    </div>
  </div>

  <a href="../index.html" class="back-link">
    <i class="fa-solid fa-arrow-left"></i> Return to TGS Homepage
  </a>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

  // Firebase Configuration
  const firebaseConfig = {
    apiKey: "AIzaSyCTY5xdHocWcWWA29cjuqnKsSL5c8-LNdU",
    authDomain: "topsy-bf414.firebaseapp.com",
    projectId: "topsy-bf414",
    storageBucket: "topsy-bf414.firebasestorage.app",
    messagingSenderId: "525110262091",
    appId: "1:525110262091:web:6fe880db6c3d22aec0d0ce",
    measurementId: "G-XBBL95MGYW"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // DOM Elements
  const emailInput = document.getElementById("loginEmail");
  const passwordInput = document.getElementById("loginPassword");
  const loginBtn = document.getElementById("loginButton");
  const errorAlert = document.getElementById("errorAlert");
  const errorText = document.getElementById("errorText");

  // Helper: Show error message
  function showError(message) {
    errorText.textContent = message;
    errorAlert.classList.add("show");
    setTimeout(() => {
      errorAlert.classList.remove("show");
    }, 4000);
  }

  // Helper: Clear error
  function clearError() {
    errorAlert.classList.remove("show");
  }

  // Helper: Set loading state
  function setLoading(isLoading) {
    if (isLoading) {
      loginBtn.classList.add("loading");
      loginBtn.innerHTML = '<i class="fa-solid fa-spinner fa-pulse"></i> Authenticating...';
      loginBtn.disabled = true;
    } else {
      loginBtn.classList.remove("loading");
      loginBtn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> Login to Dashboard';
      loginBtn.disabled = false;
    }
  }

  // Login Function
  async function loginUser(email, password) {
    try {
      // Sign in with Firebase Auth
      const userCredential = await signInWithEmailAndPassword(auth, email, password);
      const user = userCredential.user;

      // Check if user exists in "admins" collection
      const adminDoc = await getDoc(doc(db, "admins", user.uid));

      if (!adminDoc.exists()) {
        // Sign out the user if not an admin
        await auth.signOut();
        showError("Access denied. You are not authorized as an admin.");
        return false;
      }

      // Successful admin login
      return true;
    } catch (error) {
      let errorMessage = "Login failed. ";
      switch (error.code) {
        case 'auth/invalid-credential':
        case 'auth/user-not-found':
        case 'auth/wrong-password':
          errorMessage = "Invalid email or password. Please try again.";
          break;
        case 'auth/too-many-requests':
          errorMessage = "Too many failed attempts. Please try again later.";
          break;
        case 'auth/network-request-failed':
          errorMessage = "Network error. Check your connection.";
          break;
        default:
          errorMessage += error.message;
      }
      showError(errorMessage);
      return false;
    }
  }

  // Handle login button click
  async function handleLogin() {
    clearError();
    
    const email = emailInput.value.trim();
    const password = passwordInput.value;

    // Validation
    if (!email) {
      showError("Please enter your email address.");
      emailInput.focus();
      return;
    }
    if (!password) {
      showError("Please enter your password.");
      passwordInput.focus();
      return;
    }

    // Email format validation
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailRegex.test(email)) {
      showError("Please enter a valid email address.");
      emailInput.focus();
      return;
    }

    setLoading(true);
    const isAdmin = await loginUser(email, password);
    setLoading(false);

    if (isAdmin) {
      // Small delay to show success state
      loginBtn.innerHTML = '<i class="fa-solid fa-check"></i> Success! Redirecting...';
      setTimeout(() => {
        window.location.href = "../admin/adminpage.html";
      }, 800);
    }
  }

  // Attach event listeners
  loginBtn.addEventListener("click", handleLogin);

  // Allow Enter key to submit
  emailInput.addEventListener("keypress", (e) => {
    if (e.key === "Enter") handleLogin();
  });
  passwordInput.addEventListener("keypress", (e) => {
    if (e.key === "Enter") handleLogin();
  });

  // Auto-focus on email field
  emailInput.focus();

  // Handle navigation path correction (if page is in subfolder)
  const currentPath = window.location.pathname;
  const isInPagesFolder = currentPath.includes('/pages/') || currentPath.includes('/admin/');
  
  if (isInPagesFolder) {
    const backLinks = document.querySelectorAll('.back-link, .auth-footer a[href*="index.html"]');
    backLinks.forEach(link => {
      const href = link.getAttribute('href');
      if (href && href === '../index.html') {
        link.setAttribute('href', '../../index.html');
      } else if (href && href === '../admin/adminpage.html') {
        link.setAttribute('href', '../admin/adminpage.html');
      }
    });
  }
</script>
</body>
</html>
