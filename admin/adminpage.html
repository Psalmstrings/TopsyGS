<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>
<link rel="stylesheet" href="../styles/dashboard.css">
<style>
/* Basic styling for demo */
body { font-family: Arial, sans-serif; margin:0; background:#f4f6f9; }
.dashboard-container { display:flex; height:100vh; }
.sidebar { width:220px; background:#0c1c2c; color:white; padding:25px; }
.sidebar h2 { margin-bottom:30px; }
.sidebar button { width:100%; margin:10px 0; padding:12px; border:none; background:#ff7a00; color:white; cursor:pointer; }
.main-content { flex:1; padding:30px; overflow:auto; }
.project-list { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:20px; margin-top:20px; }
.project-card { background:white; border-radius:8px; overflow:hidden; box-shadow:0 5px 15px rgba(0,0,0,0.08); padding:10px; }
.project-card img { width:100%; height:180px; object-fit:cover; border-radius:5px; }
.actions { display:flex; justify-content:space-between; margin-top:10px; }
.modal { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); display:none; align-items:center; justify-content:center; }
.modal-content { background:white; padding:30px; border-radius:8px; width:400px; }
.modal-content input, .modal-content textarea { width:100%; margin:10px 0; padding:10px; }
#previewImage { max-width:100%; margin-top:10px; display:none; }
</style>
</head>
<body>

<div class="dashboard-container">

  <!-- Sidebar -->
  <aside class="sidebar">
    <h2>Admin Dashboard</h2>
    <nav>
      <button id="addProjectBtn">Add Project</button>
      <button id="logoutBtn">Logout</button>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <h1>Projects</h1>
    <div id="projectList" class="project-list"></div>
  </main>

</div>

<!-- Modal -->
<div id="projectModal" class="modal">
  <div class="modal-content">
    <span class="close">&times;</span>
    <h2 id="modalTitle">Add Project</h2>
    <input type="text" id="projectTitle" placeholder="Project Title">
    <textarea id="projectDescription" placeholder="Project Description"></textarea>
    <input type="file" id="projectImage" accept="image/*">
    <img id="previewImage">
    <p id="uploadStatus"></p>
    <button id="saveProjectBtn">Save</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

// --- Firebase config ---
const firebaseConfig = {
  apiKey: "AIzaSyCTY5xdHocWcWWA29cjuqnKsSL5c8-LNdU",
  authDomain: "topsy-bf414.firebaseapp.com",
  projectId: "topsy-bf414",
  storageBucket: "topsy-bf414.firebasestorage.app",
  messagingSenderId: "525110262091",
  appId: "1:525110262091:web:6fe880db6c3d22aec0d0ce",
  measurementId: "G-XBBL95MGYW"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// --- Cloudinary config ---
const CLOUDINARY_URL = "https://api.cloudinary.com/v1_1/dd5p5t2rs/image/upload";
const CLOUDINARY_UPLOAD_PRESET = "topsyy-preset";

// --- DOM elements ---
const projectList = document.getElementById("projectList");
const addProjectBtn = document.getElementById("addProjectBtn");
const logoutBtn = document.getElementById("logoutBtn");
const modal = document.getElementById("projectModal");
const closeModal = document.querySelector(".close");
const modalTitle = document.getElementById("modalTitle");
const titleInput = document.getElementById("projectTitle");
const descInput = document.getElementById("projectDescription");
const imageInput = document.getElementById("projectImage");
const previewImage = document.getElementById("previewImage");
const uploadStatus = document.getElementById("uploadStatus");
const saveBtn = document.getElementById("saveProjectBtn");

let editProjectId = null;
let currentImage = ""; // keep old image URL

// --- Open Modal ---
addProjectBtn.onclick = () => {
  modal.style.display = "flex";
  modalTitle.textContent = "Add Project";
  titleInput.value = "";
  descInput.value = "";
  imageInput.value = "";
  previewImage.style.display = "none";
  editProjectId = null;
  currentImage = "";
};

// --- Close Modal ---
closeModal.onclick = () => modal.style.display = "none";

// --- Logout ---
logoutBtn.onclick = async () => {
  await signOut(auth);
  window.location.href = "login.html";
};

// --- Image Preview ---
imageInput.onchange = () => {
  const file = imageInput.files[0];
  if(file){
    previewImage.src = URL.createObjectURL(file);
    previewImage.style.display = "block";
  } else if(currentImage) {
    previewImage.src = currentImage;
    previewImage.style.display = "block";
  } else {
    previewImage.style.display = "none";
  }
};

// --- Upload Image to Cloudinary ---
async function uploadImage(file){
  uploadStatus.textContent = "Uploading image...";
  const formData = new FormData();
  formData.append("file", file);
  formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);
  const res = await fetch(CLOUDINARY_URL, { method:"POST", body: formData });
  const data = await res.json();
  uploadStatus.textContent = "Upload complete";
  return data.secure_url;
}

// --- Save Project ---
saveBtn.onclick = async () => {
  const title = titleInput.value.trim();
  const description = descInput.value.trim();
  const imageFile = imageInput.files[0];

  if(!title || !description){
    alert("Please fill all fields");
    return;
  }

  try {
    if(editProjectId){
      // Editing
      const projectRef = doc(db, "projects", editProjectId);
      const updateData = { title, description };

      if(imageFile){
        updateData.image = await uploadImage(imageFile);
      } else if(currentImage){
        updateData.image = currentImage;
      } else {
        updateData.image = "";
      }

      await updateDoc(projectRef, updateData);
    } else {
      // Adding
      let imageUrl = "";
      if(imageFile) imageUrl = await uploadImage(imageFile);

      await addDoc(collection(db, "projects"), {
        title,
        description,
        image: imageUrl || "",
        createdAt: new Date()
      });
    }

    modal.style.display = "none";
    fetchProjects();

  } catch(err){
    alert(err.message);
  }
};

// --- Fetch Projects ---
async function fetchProjects(){
  projectList.innerHTML = "";
  const snapshot = await getDocs(collection(db, "projects"));
  snapshot.forEach(docSnap => {
    const project = docSnap.data();
    const card = document.createElement("div");
    card.classList.add("project-card");
    card.innerHTML = `
      <img src="${project.image || 'https://via.placeholder.com/300'}">
      <h3>${project.title}</h3>
      <p>${project.description}</p>
      <div class="actions">
        <button class="editBtn">Edit</button>
        <button class="deleteBtn">Delete</button>
      </div>
    `;

    // --- Edit ---
    card.querySelector(".editBtn").onclick = () => {
      editProjectId = docSnap.id;
      modal.style.display = "flex";
      modalTitle.textContent = "Edit Project";
      titleInput.value = project.title;
      descInput.value = project.description;
      currentImage = project.image || "";
      previewImage.src = currentImage;
      previewImage.style.display = currentImage ? "block" : "none";
      imageInput.value = ""; // clear file input
    };

    // --- Delete ---
    card.querySelector(".deleteBtn").onclick = async () => {
      if(confirm("Delete this project?")){
        await deleteDoc(doc(db,"projects",docSnap.id));
        fetchProjects();
      }
    };

    projectList.appendChild(card);
  });
}

// --- Initial Load ---
fetchProjects();
</script>
</body>
</html>
