<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TGS Admin | Portfolio Manager</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    background: #f5f7fb;
    height: 100vh;
    overflow: hidden;
  }

  .dashboard-container {
    display: flex;
    height: 100vh;
  }

  /* SIDEBAR Premium */
  .sidebar {
    width: 280px;
    background: #0a1a1f;
    color: #eef4ff;
    display: flex;
    flex-direction: column;
    padding: 2rem 1.5rem;
    box-shadow: 2px 0 20px rgba(0, 0, 0, 0.06);
  }

  .sidebar h2 {
    font-weight: 700;
    font-size: 1.6rem;
    margin-bottom: 2rem;
    letter-spacing: -0.3px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .sidebar h2 span {
    background: #ff6a00;
    width: 8px;
    height: 32px;
    border-radius: 4px;
    display: inline-block;
  }

  .sidebar nav {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 1rem;
  }

  .sidebar button {
    background: transparent;
    border: 1px solid rgba(255, 106, 0, 0.4);
    color: white;
    padding: 12px 16px;
    border-radius: 40px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 0.9rem;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .sidebar button i {
    width: 22px;
    color: #ff6a00;
  }

  .sidebar button:hover {
    background: #ff6a00;
    border-color: #ff6a00;
    transform: translateX(4px);
  }

  .sidebar button:hover i {
    color: white;
  }

  /* MAIN CONTENT */
  .main-content {
    flex: 1;
    overflow-y: auto;
    padding: 2rem 2rem;
    background: #f8fafc;
  }

  .main-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 2rem;
    flex-wrap: wrap;
  }

  .main-header h1 {
    font-size: 2rem;
    font-weight: 700;
    color: #0a1a1f;
  }

  .stats-badge {
    background: white;
    padding: 0.5rem 1.2rem;
    border-radius: 40px;
    font-size: 0.85rem;
    font-weight: 600;
    box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    color: #ff6a00;
  }

  /* PROJECT GRID (matches portfolio-card style) */
  .project-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
    gap: 1.8rem;
  }

  .project-card {
    background: white;
    border-radius: 24px;
    overflow: hidden;
    transition: 0.25s ease;
    box-shadow: 0 12px 24px -12px rgba(0, 0, 0, 0.08);
    border: 1px solid #eef2f0;
  }

  .project-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 20px 28px -12px rgba(0, 0, 0, 0.12);
    border-color: #ff6a00;
  }

  .project-img {
    width: 100%;
    height: 210px;
    object-fit: cover;
    background: #edeae5;
  }

  .project-info {
    padding: 1.3rem 1.3rem 1.5rem;
  }

  .project-tag {
    display: inline-block;
    background: #fff1e6;
    color: #ff6a00;
    font-size: 0.7rem;
    font-weight: 700;
    padding: 0.2rem 0.9rem;
    border-radius: 40px;
    margin-bottom: 0.7rem;
  }

  .project-card h3 {
    font-size: 1.25rem;
    font-weight: 700;
    margin-bottom: 0.4rem;
  }

  .project-location {
    font-size: 0.8rem;
    color: #5f6c64;
    margin-bottom: 0.75rem;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .project-desc {
    font-size: 0.85rem;
    color: #2c3e42;
    line-height: 1.45;
    margin-bottom: 1rem;
  }

  .project-stats {
    display: flex;
    gap: 1rem;
    border-top: 1px solid #edf2ef;
    padding-top: 0.8rem;
    font-size: 0.75rem;
    font-weight: 500;
  }

  .project-stats span {
    color: #ff6a00;
    font-weight: 700;
    margin-right: 4px;
  }

  .card-actions {
    display: flex;
    gap: 12px;
    margin-top: 1rem;
  }

  .edit-btn, .delete-btn {
    flex: 1;
    padding: 8px 0;
    border-radius: 30px;
    font-weight: 600;
    font-size: 0.8rem;
    border: none;
    cursor: pointer;
    transition: 0.2s;
  }

  .edit-btn {
    background: #f0f2f5;
    color: #1e2a2e;
  }

  .edit-btn:hover {
    background: #ffefe3;
    color: #ff6a00;
  }

  .delete-btn {
    background: #fff0f0;
    color: #c2410c;
  }

  .delete-btn:hover {
    background: #ffe0db;
  }

  /* MODAL Styling (matches fields to portfolio schema) */
  .modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 2000;
  }

  .modal-content {
    background: white;
    width: 550px;
    max-width: 90%;
    border-radius: 32px;
    padding: 2rem;
    box-shadow: 0 30px 40px rgba(0,0,0,0.2);
    animation: fadeUp 0.2s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: scale(0.97);}
    to { opacity: 1; transform: scale(1);}
  }

  .modal-content h2 {
    font-size: 1.6rem;
    font-weight: 700;
    margin-bottom: 1.2rem;
    color: #0a1a1f;
  }

  .modal-content input, .modal-content textarea, .modal-content select {
    width: 100%;
    padding: 12px 14px;
    margin: 10px 0;
    border: 1px solid #e2e8f0;
    border-radius: 20px;
    font-family: inherit;
    font-size: 0.9rem;
    transition: 0.2s;
  }

  .modal-content input:focus, .modal-content textarea:focus {
    outline: none;
    border-color: #ff6a00;
    box-shadow: 0 0 0 3px rgba(255,106,0,0.1);
  }

  .modal-content textarea {
    min-height: 80px;
    resize: vertical;
  }

  .image-preview-area {
    background: #faf9f8;
    border-radius: 20px;
    padding: 12px;
    margin: 8px 0;
    text-align: center;
  }

  #previewImage {
    max-width: 100%;
    max-height: 150px;
    border-radius: 16px;
    margin-top: 8px;
    object-fit: cover;
  }

  .modal-buttons {
    display: flex;
    gap: 12px;
    margin-top: 20px;
  }

  .modal-buttons button {
    flex: 1;
    padding: 12px;
    border-radius: 40px;
    font-weight: 600;
    border: none;
    cursor: pointer;
  }

  #saveProjectBtn {
    background: #ff6a00;
    color: white;
  }

  #cancelModalBtn {
    background: #f1f3f5;
    color: #1f2a2e;
  }

  .close-icon {
    float: right;
    font-size: 1.5rem;
    cursor: pointer;
    color: #8a9aa0;
  }

  hr {
    margin: 10px 0;
  }

  .field-group {
    margin-bottom: 6px;
  }
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>

<div class="dashboard-container">

  <aside class="sidebar">
    <h2><span></span> TGS Admin</h2>
    <nav>
      <button id="addProjectBtn"><i class="fa-solid fa-plus-circle"></i> Add New Project</button>
      <button id="logoutBtn"><i class="fa-solid fa-sign-out-alt"></i> Logout</button>
    </nav>
    <div style="margin-top: auto; font-size: 0.7rem; opacity: 0.6; padding-top: 2rem;">
      <i class="fa-regular fa-compass"></i> Survey & Geoinformatics
    </div>
  </aside>

  <main class="main-content">
    <div class="main-header">
      <h1><i class="fa-solid fa-layer-group" style="color:#ff6a00;"></i> Portfolio Projects</h1>
      <div class="stats-badge" id="projectCount">0 projects</div>
    </div>
    <div id="projectList" class="project-list"></div>
  </main>
</div>

<!-- MODAL (Fields match the schema: title, description, image, location, tag, stats) -->
<div id="projectModal" class="modal">
  <div class="modal-content">
    <span class="close-icon" id="closeModalBtn">&times;</span>
    <h2 id="modalTitle">➕ Add Project</h2>
    <div class="field-group">
      <input type="text" id="projectTitle" placeholder="Project title * (e.g. Mickmakin Nigeria Ltd)">
    </div>
    <div class="field-group">
      <input type="text" id="projectLocation" placeholder="Location 📍 e.g. Akure, Nigeria">
    </div>
    <div class="field-group">
      <select id="projectTag">
        <option value="Residential">Residential</option>
        <option value="Commercial/Energy">Commercial/Energy</option>
        <option value="Industrial">Industrial</option>
        <option value="Infrastructure">Infrastructure</option>
        <option value="Government">Government</option>
      </select>
    </div>
    <div class="field-group">
      <textarea id="projectDescription" placeholder="Project description (detailed)"></textarea>
    </div>
    <div class="field-group">
      <input type="text" id="projectStatsLeft" placeholder="Stat left (e.g. 120 plots)">
      <input type="text" id="projectStatsRight" placeholder="Stat right (e.g. ±2cm accuracy)" style="margin-top: 6px;">
    </div>
    <div class="image-preview-area">
      <label style="font-weight:500;"><i class="fa-regular fa-image"></i> Project image</label>
      <input type="file" id="projectImage" accept="image/*">
      <img id="previewImage" style="display: none; margin-top: 8px;">
      <p id="uploadStatus" style="font-size:12px; color:#ff6a00;"></p>
    </div>

    <div class="modal-buttons">
      <button id="saveProjectBtn">Save Project</button>
      <button id="cancelModalBtn">Cancel</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
  import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

  // Firebase Config
  const firebaseConfig = {
    apiKey: "AIzaSyCTY5xdHocWcWWA29cjuqnKsSL5c8-LNdU",
    authDomain: "topsy-bf414.firebaseapp.com",
    projectId: "topsy-bf414",
    storageBucket: "topsy-bf414.firebasestorage.app",
    messagingSenderId: "525110262091",
    appId: "1:525110262091:web:6fe880db6c3d22aec0d0ce",
    measurementId: "G-XBBL95MGYW"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // Cloudinary config
  const CLOUDINARY_URL = "https://api.cloudinary.com/v1_1/dd5p5t2rs/image/upload";
  const CLOUDINARY_UPLOAD_PRESET = "topsyy-preset";

  // DOM Elements
  const projectListEl = document.getElementById("projectList");
  const addBtn = document.getElementById("addProjectBtn");
  const logoutBtn = document.getElementById("logoutBtn");
  const modal = document.getElementById("projectModal");
  const closeModalBtn = document.getElementById("closeModalBtn");
  const cancelModal = document.getElementById("cancelModalBtn");
  const modalTitle = document.getElementById("modalTitle");
  const titleInput = document.getElementById("projectTitle");
  const locationInput = document.getElementById("projectLocation");
  const tagSelect = document.getElementById("projectTag");
  const descInput = document.getElementById("projectDescription");
  const statsLeft = document.getElementById("projectStatsLeft");
  const statsRight = document.getElementById("projectStatsRight");
  const imageInput = document.getElementById("projectImage");
  const previewImg = document.getElementById("previewImage");
  const uploadStatus = document.getElementById("uploadStatus");
  const saveBtn = document.getElementById("saveProjectBtn");
  const projectCountSpan = document.getElementById("projectCount");

  let editModeId = null;
  let existingImageUrl = "";

  // Helper: Open Modal (reset)
  function openModal(isEdit = false) {
    modal.style.display = "flex";
    if (!isEdit) {
      modalTitle.textContent = "➕ Add New Project";
      titleInput.value = "";
      locationInput.value = "";
      tagSelect.value = "Residential";
      descInput.value = "";
      statsLeft.value = "";
      statsRight.value = "";
      imageInput.value = "";
      previewImg.style.display = "none";
      previewImg.src = "";
      existingImageUrl = "";
      editModeId = null;
    }
  }

  function closeModalFunc() {
    modal.style.display = "none";
    editModeId = null;
    uploadStatus.textContent = "";
  }

  addBtn.onclick = () => openModal(false);
  closeModalBtn.onclick = closeModalFunc;
  cancelModal.onclick = closeModalFunc;
  window.onclick = (e) => { if(e.target === modal) closeModalFunc(); };

  // Image preview
  imageInput.onchange = (e) => {
    const file = e.target.files[0];
    if(file) {
      const reader = new FileReader();
      reader.onload = (ev) => {
        previewImg.src = ev.target.result;
        previewImg.style.display = "block";
      };
      reader.readAsDataURL(file);
    } else if(existingImageUrl) {
      previewImg.src = existingImageUrl;
      previewImg.style.display = "block";
    } else {
      previewImg.style.display = "none";
    }
  };

  async function uploadImageToCloudinary(file) {
    uploadStatus.textContent = "⬆ Uploading...";
    const formData = new FormData();
    formData.append("file", file);
    formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);
    const res = await fetch(CLOUDINARY_URL, { method: "POST", body: formData });
    const data = await res.json();
    uploadStatus.textContent = "✅ Uploaded";
    return data.secure_url;
  }

  // Save project (create/update)
  saveBtn.onclick = async () => {
    const title = titleInput.value.trim();
    const location = locationInput.value.trim();
    const tag = tagSelect.value;
    const description = descInput.value.trim();
    const leftStat = statsLeft.value.trim();
    const rightStat = statsRight.value.trim();

    if (!title || !description || !location) {
      alert("Please fill Title, Location and Description");
      return;
    }

    let imageUrl = existingImageUrl;
    const file = imageInput.files[0];
    if (file) {
      try {
        imageUrl = await uploadImageToCloudinary(file);
      } catch(err) {
        alert("Image upload failed");
        return;
      }
    } else if (!editModeId && !imageUrl) {
      imageUrl = "https://images.unsplash.com/photo-1581091226033-d5c48150dbaa?w=800"; // placeholder
    }

    const projectData = {
      title,
      location,
      tag,
      description,
      statsLeft: leftStat || "Precision",
      statsRight: rightStat || "Trusted",
      image: imageUrl,
      updatedAt: new Date()
    };

    try {
      if (editModeId) {
        await updateDoc(doc(db, "projects", editModeId), projectData);
      } else {
        await addDoc(collection(db, "projects"), { ...projectData, createdAt: new Date() });
      }
      closeModalFunc();
      fetchProjects();
    } catch (err) {
      alert("Error saving: " + err.message);
    }
  };

  // Fetch and render portfolio cards (matching frontend design)
  async function fetchProjects() {
    const querySnapshot = await getDocs(collection(db, "projects"));
    projectListEl.innerHTML = "";
    let counter = 0;
    querySnapshot.forEach((docSnap) => {
      const p = docSnap.data();
      counter++;
      const card = document.createElement("div");
      card.className = "project-card";
      card.innerHTML = `
        <img class="project-img" src="${p.image || 'https://images.unsplash.com/photo-1581091226033-d5c48150dbaa?w=800'}" alt="${p.title}">
        <div class="project-info">
          <span class="project-tag">${p.tag || 'Residential'}</span>
          <h3>${escapeHtml(p.title)}</h3>
          <div class="project-location"><i class="fa-solid fa-location-dot"></i> ${escapeHtml(p.location || 'Nigeria')}</div>
          <div class="project-desc">${escapeHtml(p.description.substring(0, 100))}${p.description.length > 100 ? '...' : ''}</div>
          <div class="project-stats">
            <span><i class="fa-regular fa-chart-bar"></i> ${escapeHtml(p.statsLeft || 'Area')}</span> • 
            <span>${escapeHtml(p.statsRight || 'Accuracy')}</span>
          </div>
          <div class="card-actions">
            <button class="edit-btn" data-id="${docSnap.id}"><i class="fa-regular fa-pen-to-square"></i> Edit</button>
            <button class="delete-btn" data-id="${docSnap.id}"><i class="fa-regular fa-trash-can"></i> Delete</button>
          </div>
        </div>
      `;
      projectListEl.appendChild(card);
    });
    projectCountSpan.innerText = `${counter} projects`;

    // attach edit/delete event listeners
    document.querySelectorAll(".edit-btn").forEach(btn => {
      btn.addEventListener("click", async (e) => {
        const id = btn.getAttribute("data-id");
        const docRef = doc(db, "projects", id);
        const snap = await getDocs(collection(db, "projects"));
        let project = null;
        snap.forEach(d => { if(d.id === id) project = { id: d.id, ...d.data() }; });
        if(project) {
          editModeId = id;
          titleInput.value = project.title || "";
          locationInput.value = project.location || "";
          tagSelect.value = project.tag || "Residential";
          descInput.value = project.description || "";
          statsLeft.value = project.statsLeft || "";
          statsRight.value = project.statsRight || "";
          existingImageUrl = project.image || "";
          if(existingImageUrl) {
            previewImg.src = existingImageUrl;
            previewImg.style.display = "block";
          } else {
            previewImg.style.display = "none";
          }
          imageInput.value = "";
          modalTitle.textContent = "✏️ Edit Project";
          modal.style.display = "flex";
        }
      });
    });

    document.querySelectorAll(".delete-btn").forEach(btn => {
      btn.addEventListener("click", async () => {
        const id = btn.getAttribute("data-id");
        if(confirm("Permanently delete this project?")) {
          await deleteDoc(doc(db, "projects", id));
          fetchProjects();
        }
      });
    });
  }

  function escapeHtml(str) {
    if(!str) return "";
    return str.replace(/[&<>]/g, function(m) {
      if(m === '&') return '&amp;';
      if(m === '<') return '&lt;';
      if(m === '>') return '&gt;';
      return m;
    });
  }

  // Logout
  logoutBtn.onclick = async () => {
    await signOut(auth);
    window.location.href = "login.html";
  };

  fetchProjects();
</script>
</body>
</html>
